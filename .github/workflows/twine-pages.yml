# brisberg/ci — .github/workflows/twine-pages.yml
#
# Builds a @brisberg/spindle Twine project and deploys the single compiled HTML
# file to the calling repo's own GitHub Pages site.
#
# Requires @brisberg/spindle >= 0.5.1 (Node >= 22.17, config in spindle.json or
# package.json "spindle", execs `tweego` from PATH, accepts --out), a committed
# package-lock.json, and a `build` script whose last command is spindle. Games
# still on 0.3/0.4 must stay on @v1.
#
# The caller's entire pipeline is:
#
#   name: Deploy
#   on:
#     push: { branches: [main] }
#     workflow_dispatch:
#   permissions:          # required — see note below
#     contents: read
#     pages: write
#     id-token: write
#   jobs:
#     deploy:
#       uses: brisberg/ci/.github/workflows/twine-pages.yml@v2
#
# `permissions` cannot be omitted. A called workflow's token can never exceed
# what the caller granted, so declaring them here does not give them to itself.

name: Twine → Pages

on:
  workflow_call:
    inputs:
      tweego-version:
        description: Tweego release to build with. Bump here once for every game.
        type: string
        default: "2.1.1"
      tweego-sha256:
        description: >
          Checksum of tweego-<version>-linux-x64.zip. Must be updated with the
          version. Release assets are mutable; a tag alone is not a pin.
        type: string
        default: "2ed11c3aa66c88ec5382b51061c7782152632b88916777428ab57a66feb7e5aa"
      node-version:
        description: >
          Escape hatch. spindle requires Node >= 22.17; if a future Node breaks
          a game, it can pin back here without blocking the others.
        type: string
        default: "22"
    outputs:
      url:
        description: Where the game was published.
        value: ${{ jobs.deploy.outputs.url }}

# Only first-party actions. No third-party action in this chain holds a token or
# can be abandoned out from under it.
permissions:
  contents: read
  pages: write
  id-token: write

# Never race two deploys, never cancel one mid-flight. Scoped per calling repo,
# so games do not queue behind each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # Tweego ships as a prebuilt static binary. The zip is unpacked whole, so
      # its bundled storyformats/ sit next to the binary, where tweego finds
      # them. spindle >= 0.5 bundles no formats; games should commit their own
      # storyformats/ and treat these as a fallback, not a pin.
      - name: Install tweego ${{ inputs.tweego-version }}
        env:
          VERSION: ${{ inputs.tweego-version }}
          SHA256: ${{ inputs.tweego-sha256 }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/tweego"
          url="https://github.com/tmedwards/tweego/releases/download/v${VERSION}/tweego-${VERSION}-linux-x64.zip"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/tweego.zip" "$url"
          echo "${SHA256}  ${RUNNER_TEMP}/tweego.zip" | sha256sum -c -
          mkdir -p "$dest"
          unzip -q "${RUNNER_TEMP}/tweego.zip" -d "$dest"
          chmod +x "$dest/tweego"
          echo "$dest" >> "$GITHUB_PATH"

      - run: npm ci

      # npm appends args after `--` to the build script, so --out overrides
      # `out` from the game's config whether or not the script passes -c. The
      # game's own output path is never read, and nothing is written into the
      # checkout. Needs spindle >= 0.5.1; older versions reject the flag.
      - run: npm run build -- --out "${RUNNER_TEMP}/site/index.html"

      # Guards against a build script that exits 0 without spindle writing
      # the file, e.g. when spindle is not its last command.
      - name: Check the deploy package
        run: |
          set -euo pipefail
          site="${RUNNER_TEMP}/site/index.html"
          if [ ! -s "$site" ]; then
            echo "::error::no compiled story at $site. Does the build script end with spindle?"
            exit 1
          fi
          echo "built $site ($(wc -c < "$site") bytes)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
